<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
@theme {
  --color-bg: #1C1F23;
  --color-float: #111316;
  --color-ui: #2C333B;
  --color-fg: #AEB8C4;
  --color-muted: #6E7A87;
  --color-bright: #FFFFFF;
  --color-yellow: #B8A36A;
}
</style>
</head>
<body class="m-0">
<div id="og" class="relative w-[1200px] h-[630px] overflow-hidden bg-bg">
  <div class="absolute left-16 top-0 bottom-0 w-[470px] flex flex-col justify-center gap-6">
    <p class="text-2xl text-muted">forbear log, entry 005</p>
    <h1 class="text-[54px] leading-[1.05] font-bold text-bright">A calculator,<br>and a C API</h1>
    <p class="text-xl leading-snug text-muted">the first program built with forbear, text input, and a C API from Jai.</p>
  </div>
  <img src="../assets/2026-11-18-calculator.png" class="absolute left-[850px] top-[40px] w-[300px] max-w-none rounded-2xl ring-1 ring-ui shadow-2xl">
  <pre class="absolute left-[570px] top-[348px] m-0 bg-float text-fg text-[20px] leading-snug p-6 rounded-2xl ring-1 ring-ui shadow-2xl"><code><span style="color:#b8a36a">FB_ELEMENT</span><span style="color:#c8d0d8">(</span>
    <span style="color:#7fa0b8">.background    </span>= <span style="color:#b8a36a">fb_color</span><span style="color:#c8d0d8">(</span><span style="color:#b8a36a">fb_rgb</span><span style="color:#c8d0d8">(</span><span style="color:#7fa0b8">44</span><span style="color:#c8d0d8">, </span><span style="color:#7fa0b8">49</span><span style="color:#c8d0d8">, </span><span style="color:#7fa0b8">56</span><span style="color:#c8d0d8">)),</span>
    <span style="color:#7fa0b8">.border_radius </span>= <span style="color:#7fa0b8">6</span><span style="color:#c8d0d8">,</span>
    <span style="color:#7fa0b8">.padding       </span>= <span style="color:#b8a36a">fb_all_sides</span><span style="color:#c8d0d8">(</span><span style="color:#7fa0b8">8</span><span style="color:#c8d0d8">),</span>
<span style="color:#c8d0d8">) {</span>
    <span style="color:#b8a36a">FB_TEXT</span><span style="color:#c8d0d8">(</span><span style="color:#b8a36a">"click me"</span><span style="color:#c8d0d8">);</span>
<span style="color:#c8d0d8">}</span></code></pre>
</div>
</body>
</html>
